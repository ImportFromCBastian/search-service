name: search-service

services:
  # Database: MongoDB
  mongo:
    image: mongo:${MONGO_IMAGE_TAG:-7.0}
    container_name: search-service-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ${MONGO_DATA_DIR:-./data/mongo}:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Cache / Queue Broker: Redis
  redis:
    image: redis:7-alpine
    container_name: search-service-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Backend NestJS Application
  api:
    build:
      context: .
      target: runtime
    container_name: search-service-api
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/${MONGO_DATABASE:-search-service}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped